name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing and provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # npm >= 11.5 is required for trusted publishing (OIDC).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check that the tag matches the package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/utils packages/ui; do
            version=$(node -p "require('./$pkg/package.json').version")
            if [ "$version" != "$tag" ]; then
              echo "::error file=$pkg/package.json::version $version does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      # `bun pm pack` rewrites `workspace:*` dependencies to real versions; npm publishes the
      # tarballs. Utils goes first because the components depend on it. Versions that are
      # already on the registry are skipped, so a failed run can be re-run safely.
      - name: Publish to npm
        run: |
          tag="${GITHUB_REF_NAME#v}"
          case "$tag" in *-*) dist_tag="${tag#*-}"; dist_tag="${dist_tag%%.*}" ;; *) dist_tag=latest ;; esac
          mkdir -p "$RUNNER_TEMP/pack"
          for pkg in packages/utils packages/ui; do
            name=$(node -p "require('./$pkg/package.json').name")
            if npm view "$name@$tag" version >/dev/null 2>&1; then
              echo "$name@$tag is already published, skipping"
              continue
            fi
            rm -f "$RUNNER_TEMP"/pack/*.tgz
            (cd "$pkg" && bun pm pack --destination "$RUNNER_TEMP/pack")
            npm publish "$RUNNER_TEMP"/pack/*.tgz --access public --provenance --tag "$dist_tag"
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease
